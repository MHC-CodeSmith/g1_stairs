# Skills available to the runtime, the distillation (as teachers) and the planner (as tools).
# path: relative to the repo root unless absolute. Provenance is kept so every imported policy is reproducible.
dwaq_upstream:
  kind: dwaq
  path: G1DWAQ_Lab/TienKung-Lab/logs/g1_dwaq/2026-01-16_00-46-00/model_9999.pt
  source: https://github.com/liuyufei-nubot/G1DWAQ_Lab @ bebb0ea (BSD-3)
  controls: whole body (29)
  command: [vx, vy, yaw_rate]
  good_at: blind stair climbing (0-23 cm), rough terrain; arms at default pose
dwaq_bully:
  kind: dwaq
  path: logs/g1_dwaq_bully/2026-09-27_03-06-52_bully/model_999.pt
  dance_period: 6.7
  source: this repo, g1_dwaq_bully fine-tune
  controls: legs + waist pitch (arms/waist yaw+roll overridden by the bully clip)
  command: [vx, vy, yaw_rate]
  good_at: blind stair climbing while the upper body moves (trained under the bully clip)
agile_velocity_height:
  kind: agile_velocity_height
  path: skills/imported/agile/unitree_g1_velocity_height_history_torchscript.pt
  source: https://github.com/nvidia-isaac/WBC-AGILE @ skills/imported/agile/COMMIT (Apache-2.0)
  controls: legs (12)
  command: [vx, vy, yaw_rate, pelvis_height]
  good_at: flat/slightly rough walking, squatting to 0.4 m pelvis height, random upper body while standing
bully_clip:
  kind: clip
  path: reference/bully_g1.npz
  source: tools/extract_pose.py + tools/retarget_g1.py on the Spider-Man 3 GIF
  controls: arms + waist yaw/roll (16)
  good_at: Bully Maguire dance, 6.7 s loop
g1_body_student:
  kind: dwaq
  path: logs/g1_body/2026-09-28_04-39-19_body/model_1499.pt
  extras: [height_cmd]
  source: this repo, g1_body distillation (teachers dwaq_bully + agile_velocity_height)
  controls: legs + waist pitch (upper body free for any upper-body skill)
  command: [vx, vy, yaw_rate, pelvis_height]
  good_at: one controller for walking, stairs and crouching under arbitrary upper-body motion
